<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .badge-text {
      font-family: 'SF Mono', Monaco, Consolas, 'Liberation Mono', monospace;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 1.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 18px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .accent-tag {
      font-family: 'SF Mono', Monaco, Consolas, monospace;
      font-size: 12px;
      fill: #a5b4fc;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1000" height="240" rx="16" fill="url(#bgGradient)" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="40" r="90" fill="#0284c7" opacity="0.25" filter="url(#glow)" />
  <circle cx="850" cy="180" r="100" fill="#7c3aed" opacity="0.3" filter="url(#glow)" />
  <circle cx="500" cy="220" r="80" fill="#38bdf8" opacity="0.15" filter="url(#glow)" />

  <!-- Subtle Tech Grid Lines -->
  <g stroke="#334155" stroke-width="0.75" opacity="0.35">
    <line x1="0" y1="60" x2="1000" y2="60" />
    <line x1="0" y1="120" x2="1000" y2="120" />
    <line x1="0" y1="180" x2="1000" y2="180" />
    <line x1="200" y1="0" x2="200" y2="240" />
    <line x1="400" y1="0" x2="400" y2="240" />
    <line x1="600" y1="0" x2="600" y2="240" />
    <line x1="800" y1="0" x2="800" y2="240" />
  </g>

  <!-- Top Badge Pill -->
  <g transform="translate(500, 48)">
    <rect x="-185" y="-14" width="370" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <circle cx="-165" cy="0" r="4" fill="#38bdf8" />
    <text x="5" y="4" text-anchor="middle" class="badge-text">FULL STACK SOFTWARE ENGINEER</text>
  </g>

  <!-- Main Headline -->
  <text x="500" y="118" text-anchor="middle" class="title">Muhammad Ashraf</text>

  <!-- Dynamic Colored Subtitle -->
  <text x="500" y="158" text-anchor="middle" class="subtitle">Next.js 16 • TypeScript • Cloudflare Workers • Real-Time Systems</text>

  <!-- Bottom Accent Tech Bar -->
  <g transform="translate(500, 195)">
    <rect x="-260" y="-12" width="520" height="24" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.8" opacity="0.7" />
    <text x="0" y="4" text-anchor="middle" class="accent-tag">⚡ Edge Architecture &amp; Scalable Systems &nbsp;•&nbsp; 🇵🇰 Pakistan</text>
  </g>

  <!-- Sleek Glowing Bottom Border -->
  <rect x="0" y="236" width="1000" height="4" rx="2" fill="url(#textGradient)" />
</svg>
